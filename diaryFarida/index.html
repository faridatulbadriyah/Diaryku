<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diary Farida, ruang untuk menulis dan merenung setiap hari.">
  <title>Diary Farida — Ruang Menulis &amp; Merenung</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Header utama aplikasi -->
  <header class="site-header container">
    <div>
      <h1>📖 Diary Farida</h1>
      <p class="subtitle">Ruang menulis &amp; merenung</p>
    </div>
    <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
  </header>

  <main class="container">
    <!-- Navigasi dan kalender bulanan -->
    <section class="calendar-section" aria-labelledby="calendarHeading">
      <h2 id="calendarHeading" class="sr-only">Kalender diary</h2>
      <div class="calendar-navigation">
        <button class="circle-button" id="prevMonth" type="button" aria-label="Bulan sebelumnya">←</button>
        <div class="month-controls">
          <h2 id="monthYear">Januari 2025</h2>
          <button class="today-button" id="todayButton" type="button">Hari Ini</button>
        </div>
        <button class="circle-button" id="nextMonth" type="button" aria-label="Bulan berikutnya">→</button>
      </div>

      <div class="calendar-weekdays" aria-hidden="true">
        <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
      </div>
      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Kalender diary"></div>
      <div class="empty-state" id="emptyState" hidden>Mulai tulis hari pertamamu! ✨</div>
    </section>

    <!-- Ringkasan statistik bulan aktif -->
    <section class="stats-section" aria-labelledby="statsHeading">
      <h2 id="statsHeading" class="sr-only">Statistik tulisan</h2>
      <div class="stats-grid">
        <article class="stat-card"><strong id="totalEntries">0</strong><span>Total entri bulan ini</span></article>
        <article class="stat-card"><strong id="currentStreak">0</strong><span>Streak harian saat ini</span></article>
        <article class="stat-card"><strong id="totalWords">0</strong><span>Total kata bulan ini</span></article>
      </div>
    </section>
  </main>

  <!-- Footer aplikasi -->
  <footer class="site-footer">Dibuat dengan ❤️ untuk latihan menulis harian</footer>
</body>
</html>
